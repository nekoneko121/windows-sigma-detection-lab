title: PowerShell EncodedCommand Usage
id: 22222222-3333-4444-5555-666666666666
status: experimental
description: Detects use of EncodedCommand which is often used to obfuscate PowerShell commands
author: nekoneko121
date: 2026/01/09
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: 'EncodedCommand'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
